name: Update marketing spend (Novadata)

on:
  schedule:
    # Daily at 07:00 UTC, after the Novadata export refreshes (~06:00 UTC).
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Refresh marketing spend from Novadata
        run: python update_marketing_spend.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marketing_spend.csv data/metadata.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update marketing spend from Novadata export"
            git push
          fi
